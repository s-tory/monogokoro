# Lints and tests the standalone SO101 impedance-control Rust crate. Kept fully separate from the
# Python CI matrix (fast_tests.yml, full_tests.yml, ...) and path-filtered so it never blocks
# Python-only PRs.
name: Rust

permissions:
  contents: read

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "rust/**"
      - ".github/workflows/rust_tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "rust/**"
      - ".github/workflows/rust_tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rust-quality-and-tests:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/so101_impedance_ctrl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Installs rustup and a stable toolchain, but not the one the gates below actually run:
      # `rust/so101_impedance_ctrl/rust-toolchain.toml` pins that, and cargo honours it because the
      # steps below run inside the crate. The pin is the point -- `cargo fmt --check` and
      # `clippy -D warnings` only mean something if the runner and the developer's machine agree on
      # the version, and `stable` here moves on its own schedule.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust/so101_impedance_ctrl

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets
